name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 ps2exe
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: 计算版本号
        id: ver
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $v = & .\scripts\ci-version.ps1 -RunNumber $env:GITHUB_RUN_NUMBER
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Build version: $v"

      - name: 验证版本计算
        shell: powershell
        run: .\tests\ci-version.ps1

      - name: 打包单文件 exe
        shell: powershell
        run: .\build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CacheClean-${{ steps.ver.outputs.version }}
          path: dist/CacheClean.exe
          if-no-files-found: error

      - name: 自动创建标签并发布 Release
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CacheClean v${{ steps.ver.outputs.version }}
          files: dist/CacheClean.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
